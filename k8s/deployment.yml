apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-metrics-api
  labels:
    app: devops-metrics-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-metrics-api
  template:
    metadata:
      labels:
        app: devops-metrics-api
    spec:
      containers:
        - name: devops-metrics-api
          image: 171384357873.dkr.ecr.eu-west-2.amazonaws.com/devops-platform-api:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: devops-metrics-api
spec:
  selector:
    app: devops-metrics-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer